pre-commit:
  parallel: true
  jobs:
    - name: biome-fix
      glob: "*.{js,ts,jsx,tsx,mjs,mts,cjs,cts,json,jsonc,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true
    - name: typecheck
      glob: "*.{ts,tsx}"
      skip:
        - run: test "${NO_TYPECHECK:-0}" -eq 1
      run: pnpm typecheck

pre-push:
  jobs:
    - name: gate
      run: pnpm lint && pnpm typecheck && pnpm test:coverage && pnpm build
